<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 256 256" width="256" height="256" role="img" aria-labelledby="title">
  <title id="title">RuneScript</title>
  <!--
    Small-size variant of runescript.svg for application icons (16-48 px).
    Same construction with heavier strokes, one rune fork per arm, and a
    solid core so the silhouette survives downscaling.
  -->
  <defs>
    <g id="arm" fill="none" stroke="#1F6FEB" stroke-width="22" stroke-linecap="square" stroke-linejoin="miter">
      <path d="M128 110 V26"/>
      <path d="M100 46 L128 74 L156 46"/>
    </g>
    <path id="bolt" fill="#FFB020" d="M137 36 L114 76 L128 76 L119 104 L150 62 L136 62 L148 36 Z"/>
  </defs>

  <use xlink:href="#arm" href="#arm"/>
  <use xlink:href="#arm" href="#arm" transform="rotate(60 128 128)"/>
  <use xlink:href="#arm" href="#arm" transform="rotate(120 128 128)"/>
  <use xlink:href="#arm" href="#arm" transform="rotate(180 128 128)"/>
  <use xlink:href="#arm" href="#arm" transform="rotate(240 128 128)"/>
  <use xlink:href="#arm" href="#arm" transform="rotate(300 128 128)"/>

  <path d="M128 102 L151 115 L151 141 L128 154 L105 141 L105 115 Z" fill="#1F6FEB"/>

  <use xlink:href="#bolt" href="#bolt" transform="rotate(30 128 128)"/>
  <use xlink:href="#bolt" href="#bolt" transform="rotate(210 128 128)"/>
</svg>
